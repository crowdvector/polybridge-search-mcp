[project]
name = "polybridge-mcp-server"
version = "0.2.7"
description = "PolyBridge MCP bundle"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
polybridge-mcp-server = "polybridge_mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polybridge_mcp_server", "src/polybridge_contracts"]
